[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botron-rag"
version = "0.1.0"
description = "BOTRON RAG backend — FastAPI + fastembed + Groq"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "groq>=0.9.0",
    "fastembed>=0.5.0,<0.8.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "supabase>=2.3.0",
]

[tool.setuptools]
py-modules = ["analytics", "knowledge", "main", "retriever"]

[tool.fastapi]
entrypoint = "main:app"
